name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# D10 (#14): Izinler workflow duzeyinde tanimliydi ve test job'ina miras
# kaliyordu. O job sabitlenmemis ucuncu taraf action ve paket script'i
# calistiriyor; ele gecirilirse OIDC token basip Pages'e yayin yapabilirdi.
# Varsayilan en dar; yayin izni YALNIZCA deploy job'inda.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Birim testleri
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Bagimliliklar
        run: pip install -r server/requirements.txt
      - name: zip_to_md testleri
        run: python3 tools/test_zip_to_md.py
      - name: render + site testleri
        run: python3 tools/test_site.py
      - name: skill zip testleri
        run: python3 tools/test_skill_zips.py
      - name: PHP kurulumu
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Composer bagimliliklari
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: PHPUnit
        run: ./vendor/bin/phpunit --testsuite Unit

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: PHP kurulumu
        uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45 # v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring
          coverage: none
      - name: Composer bagimliliklari
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: npm bagimliliklari
        run: npm ci
      - name: Playwright tarayici onbellegi
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Chromium kur
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Chromium sistem bagimliliklari
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: E2E paketi
        run: ./tests/E2E/calistir.sh
      - name: Ekran goruntuleri
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-ekran-goruntuleri
          path: var/ekran/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Site kur
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Bagimliliklar
        run: pip install -r server/requirements.txt
      - name: Statik siteyi uret
        run: python3 tools/build_site.py --src docs --out _site
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site

  deploy:
    name: Yayinla
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
